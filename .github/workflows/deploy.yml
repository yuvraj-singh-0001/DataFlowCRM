
name: Deploy DataFlow CRM

on:
  push:
    branches:
      - main
    paths:
      - "client/**"
      - "server/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            cd /home/ubuntu/dataflow-crm

            git pull --ff-only origin main

            npm install --prefix server
            npm install --prefix client

            npm run build --prefix client

            pm2 describe dataflow-crm-backend >/dev/null
            pm2 restart dataflow-crm-backend

            echo "DataFlow CRM deployment completed."
